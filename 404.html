<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; form-action https://formspree.io 'self'; connect-src 'self' https://formspree.io; base-uri 'self'; object-src 'none';" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Page Not Found — BIKO Industries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .notfound-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      background: var(--dark);
    }
    .notfound-code {
      font-family: var(--font-head);
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 800;
      color: var(--green);
      line-height: 1;
      margin-bottom: 8px;
    }
    .notfound-wrap h1 {
      color: var(--white);
      font-size: clamp(1.4rem, 3vw, 2rem);
      margin-bottom: 16px;
    }
    .notfound-wrap p {
      color: rgba(255,255,255,.6);
      max-width: 420px;
      margin-bottom: 40px;
    }
    .notfound-links {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="notfound-wrap">
    <div class="notfound-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>
    <div class="notfound-links">
      <a href="index.html" class="btn btn-primary">Back to Home</a>
      <a href="contact.html" class="btn btn-secondary">Contact Us</a>
    </div>
  </div>
</body>
</html>
